; コイン別音声貯金箱 ファームウェア
; ターゲット：Seeed Studio XIAO ESP32C3（秋月 117454）
;
; env:esp32c3      … 自作ソータ版 v3.0（src/main_selfsort.cpp）。既定
; env:esp32c3_lane … とりだし君のレーン方式 v2.1（src/main_lane.cpp）。とりだし君に戻すとき用
; env:esp32c3_audio_test … USB が使えない状態でも 12V 単独で 6 音声を順に確認する一時試験用
; 各 env は src/ の 1 ファイルだけをビルドする（setup/loop が重複しないように）

[env:esp32c3]
platform = espressif32@^6.9.0      ; Arduino core 2.0.x 系に固定（3.x は WDT API が構造体渡しに変わる）
board = seeed_xiao_esp32c3
framework = arduino
build_src_filter = +<*> -<main_lane.cpp> -<main_audio_test.cpp>
build_flags =
    -DARDUINO_USB_MODE=1           ; USB-CDC を Serial にする（XIAO は USB-シリアル変換 IC を持たない）
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I include                     ; lib/ と test/ からも Config.h を見えるようにする
monitor_speed = 115200
monitor_echo = yes                 ; 打った文字が見える
monitor_eol = LF                   ; シリアルコマンドの終端を LF に統一
lib_deps =
    dfrobot/DFRobotDFPlayerMini@^1.0.5

[env:esp32c3_lane]
extends = env:esp32c3
build_src_filter = +<*> -<main_selfsort.cpp> -<main_audio_test.cpp>

[env:esp32c3_audio_test]
extends = env:esp32c3
build_src_filter = +<main_audio_test.cpp>

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I include
